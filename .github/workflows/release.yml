name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # secrets 不能直接用在 step 的 if 里，先折算成布尔环境变量
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      # 配置 AI_BASE_URL + AI_API_KEY（可选 AI_MODEL）后用 OpenAI 兼容接口生成更新说明，否则退回提交列表
      HAS_AI: ${{ secrets.AI_API_KEY != '' && secrets.AI_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成更新日志需要完整历史和 tag

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # 配置了 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 四个仓库 secret 时用正式签名，
      # 否则退回 debug 签名（仍可安装，但不能覆盖安装正式签名的版本）。
      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          # 去掉粘贴带入的空白后再解码；解码失败时直接报错
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" || { echo "::error::KEYSTORE_BASE64 不是合法的 base64"; exit 1; }
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # 打包前先校验密钥库：库密码错、别名不存在都会在这里报出明确原因，而不是 packageRelease 里的 "null"
      - name: Verify signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          echo "keystore size: $(stat -c %s "$RUNNER_TEMP/release.jks") bytes"
          # 与 build.gradle.kts 一致：去掉首尾空白/换行
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          ALIAS="$(printf '%s' "${KEY_ALIAS:-notice}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          KEYPASS="$(printf '%s' "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$KEY_PASSWORD" ] && [ "$KEYPASS" != "$KEYSTORE_PASSWORD" ] && echo "::warning::KEY_PASSWORD 与 KEYSTORE_PASSWORD 不同；PKCS12 密钥库通常要求两者一致。"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" > list.txt 2>&1; then
            echo "::error::无法打开密钥库：KEYSTORE_PASSWORD 不对，或 KEYSTORE_BASE64 内容损坏 / 不是这个密钥库。"; cat list.txt; exit 1
          fi
          echo "aliases in keystore:"; grep -iE "PrivateKeyEntry|SecretKeyEntry|trustedCertEntry" list.txt | cut -d, -f1
          if ! grep -qi "^$ALIAS," list.txt; then
            echo "::error::密钥库里没有别名 '$ALIAS'，请检查 KEY_ALIAS。"; exit 1
          fi
          if ! keytool -exportcert -rfc -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$ALIAS" -keypass "$KEYPASS" >/dev/null 2>err.txt; then
            echo "::error::别名 '$ALIAS' 的密钥密码不对（KEY_PASSWORD；PKCS12 应与 KEYSTORE_PASSWORD 相同）。"; cat err.txt; exit 1
          fi
          echo "keystore OK"

      # versionName = tag（去掉前缀 v）；versionCode = x*10000 + y*100 + z（如 v1.2.3 -> 10203），
      # 手动触发或 tag 不是 x.y.z 时退回 run_number，保证仍然递增。
      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)-manual"
          fi
          NAME="${TAG#v}"
          if [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            CODE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
          else
            CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME versionCode=$CODE"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PversionName="${{ steps.version.outputs.name }}"
          -PversionCode="${{ steps.version.outputs.code }}"

      - name: Rename APK
        id: apk
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && TAG="manual-$(git rev-parse --short HEAD)"
          OUT="Notice-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}

      # 更新日志：取上一个 tag 到当前 tag 的提交；配置了 OpenAI 兼容 API 时由模型整理成面向用户的说明，
      # 否则直接列出提交。追加到 Release 说明后面，保留手写部分，重跑不重复。
      - name: Generate changelog
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gpt-4o-mini' }}
        run: |
          set -u
          TAG="$GITHUB_REF_NAME"
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}$TAG"
          MARK="## 更新内容"
          git log --no-merges --pretty=format:'- %s (%h)' "$RANGE" > commits.md
          # 只给模型提交标题和正文（不含文件统计），并限制体积，避免第三方网关生成超时
          git log --no-merges --pretty=format:'%n### %h %s%n%b' "$RANGE" > commits-detail.txt
          if [ -n "$PREV" ]; then
            COMPARE="https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
          else
            COMPARE="https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
          fi

          AI_NOTES=""
          if [ "$HAS_AI" = "true" ] && [ -s commits-detail.txt ]; then
            SYSTEM='你是 Android 应用 Notice（LSPosed 通知过滤模块：关键词规则 + 离线 AI 骚扰识别 + 端侧微调）的发布说明撰写者。根据给出的 git 提交记录写一份面向普通用户的更新说明。硬性要求：全文必须使用简体中文（提交记录是英文，需要翻译成中文，不要照抄英文句子）；用 Markdown；按「✨ 新功能」「🔧 改进」「🐛 修复」分组，没有内容的组省略；每条一句话，说用户能感知到的变化，不要出现类名、函数名、binder、正则、ICU 之类实现细节；不要编造提交里没有的内容；不要写标题和开场白，直接输出分组列表。'
            USER_MSG="$(printf '版本：%s\n请用简体中文撰写更新说明。\n提交记录：\n%s' "$TAG" "$(head -c 20000 commits-detail.txt)")"
            # 兼容 AI_BASE_URL 的几种写法：.../v1、.../v1/chat/completions、或不带 /v1（404 时自动补上重试）
            BASE="${AI_BASE_URL%/}"
            case "$BASE" in */chat/completions) URL="$BASE" ;; *) URL="$BASE/chat/completions" ;; esac
            ask_ai() {
              local extra_sys="$1" payload http
              payload="$(jq -n --arg model "$AI_MODEL" --arg sys "$SYSTEM$extra_sys" --arg user "$USER_MSG" \
                '{model: $model, temperature: 0.3, max_tokens: 1200, stream: true, messages: [{role: "system", content: $sys}, {role: "user", content: $user}]}')"
              # 流式请求：网关的超时按首字节计算，模型开始输出后连接就不会被掐断；-N 关闭 curl 缓冲
              post() { curl -sSN --max-time 600 -o resp.json -w '%{http_code}' "$URL" \
                -H "Authorization: Bearer $AI_API_KEY" -H "Content-Type: application/json" -H "Accept: text/event-stream" \
                -d "$payload" || echo 000; }
              http="$(post)"
              if [ "$http" = "404" ] && [[ "$URL" != */v1/* ]]; then
                URL="$BASE/v1/chat/completions"
                echo "::notice::接口返回 404，改用 $URL 重试。" >&2
                http="$(post)"
              fi
              # 5xx / 连接失败多为网关超时或瞬时故障：间隔重试两次
              local attempt=0
              while [ $attempt -lt 2 ] && { [ "$http" = "000" ] || [ "${http:0:1}" = "5" ]; }; do
                attempt=$((attempt + 1)); echo "AI HTTP $http，${attempt} 次重试…" >&2; sleep 15; http="$(post)"
              done
              echo "AI HTTP $http, model=$AI_MODEL, path=/${URL#*://*/}" >&2
              LAST_RESP="HTTP $http: $(head -c 400 resp.json 2>/dev/null)"
              [ "$http" = "200" ] || return 0
              if grep -q '^data:' resp.json; then
                # SSE：拼接所有 delta.content
                grep '^data:' resp.json | sed 's/^data: *//' | grep -v '^\[DONE\]' \
                  | jq -rj '.choices[0].delta.content // empty' 2>/dev/null || true
              else
                # 网关忽略了 stream 参数、直接返回完整 JSON
                jq -r '.choices[0].message.content // empty' resp.json 2>/dev/null || true
              fi
            }
            # 中文字符太少视为没按要求输出：换更强的指令重试一次
            cjk_count() { printf '%s' "$1" | python3 -c 'import re,sys; print(len(re.findall(r"[\u4e00-\u9fff]", sys.stdin.read())))'; }
            AI_NOTES="$(ask_ai '')"
            if [ -n "$AI_NOTES" ] && [ "$(cjk_count "$AI_NOTES")" -lt 10 ]; then
              echo "::notice::AI 输出不是中文，重试一次。"
              AI_NOTES="$(ask_ai ' 注意：你上一次的输出不是中文，这次必须逐条翻译成简体中文，禁止出现英文句子。')"
            fi
            if [ -n "$AI_NOTES" ] && [ "$(cjk_count "$AI_NOTES")" -lt 10 ]; then
              echo "::warning::AI 两次都未输出中文，退回提交列表。"
              AI_NOTES=""
            fi
            if [ -z "$AI_NOTES" ]; then
              echo "::warning::AI 生成更新说明失败，退回提交列表。响应：$(printf '%s' "${LAST_RESP:-}" | head -c 500)"
            fi
          fi

          {
            echo "$MARK"
            echo
            if [ -n "$AI_NOTES" ]; then
              printf '%s\n\n' "$AI_NOTES"
              echo "> 以上由 AI 根据提交记录整理。"
              echo
              echo "<details><summary>提交列表</summary>"
              echo
              cat commits.md
              echo
              echo "</details>"
            else
              cat commits.md
            fi
            echo
            echo
            echo "**完整变更**：$COMPARE"
          } > changelog.md

          gh release view "$TAG" --json body -q .body > existing.md || true
          awk -v mark="$MARK" '$0 == mark { exit } { print }' existing.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > handwritten.md
          { if [ -s handwritten.md ]; then cat handwritten.md; echo; echo; fi; cat changelog.md; } > notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Attach APK to the release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
